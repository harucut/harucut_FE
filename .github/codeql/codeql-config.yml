name: harucut codeql

# 에이전트 스킬(impeccable)이 설치해 둔 벤더 스크립트는 분석에서 뺀다.
#
# 왜:
#  - 우리가 쓴 코드가 아니라 `npx impeccable install` 이 내려받아 넣은 것이고,
#    다시 설치하면 통째로 덮어써진다. 여기서 고쳐도 다음 설치에 사라진다.
#  - 개발자가 자기 컴퓨터에서 돌리는 디자인 검사·미리보기 도구다. 빌드에 들어가지도,
#    배포되지도 않는다. 웹앱 번들과 서버 어디에도 포함되지 않는다.
#  - `.claude/`(Claude Code)와 `.github/skills/`(Copilot)에 같은 도구가 두 벌 들어 있어
#    같은 지적이 두 번씩 올라온다.
#
# 여기서 나온 지적(HTML 살균 정규식, 사용자 입력 기반 타이머 등)은 그 도구를 쓰는
# 개발자 자신의 로컬 환경에 한정된다. 제품 코드에서 같은 문제가 나오면 그대로 잡힌다.
paths-ignore:
  - .github/skills/**
  - .claude/skills/**
