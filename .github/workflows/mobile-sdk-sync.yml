name: mobile-sdk-sync

# 이번 출시 브랜치의 공식 SDK 조합 복구용 일회성 작업. 결과를 회수한 뒤 제거한다.
on:
  pull_request:
    branches: [develop]
    types: [synchronize]
    paths: [.github/workflows/mobile-sdk-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.head_ref == 'feat/harucut-web-app-readiness' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Remove obsolete compatibility patches and select SDK 57
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const root = JSON.parse(fs.readFileSync('package.json'));
          delete root.pnpm.patchedDependencies['expo-modules-core@55.0.24'];
          for (const name of ['@react-native/babel-plugin-codegen', '@react-native/babel-preset', '@react-native/codegen']) delete root.pnpm.overrides[name];
          fs.writeFileSync('package.json', JSON.stringify(root, null, 2) + '\n');
          const mobile = JSON.parse(fs.readFileSync('apps/mobile/package.json'));
          mobile.dependencies.expo = '~57.0.0';
          fs.writeFileSync('apps/mobile/package.json', JSON.stringify(mobile, null, 2) + '\n');
          fs.unlinkSync('patches/expo-modules-core@55.0.24.patch');
          JS
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir apps/mobile exec expo install --fix --pnpm
      - name: Record resolved package versions on the task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json apps/mobile/package.json pnpm-lock.yaml patches/expo-modules-core@55.0.24.patch
          git diff --cached --quiet && exit 0
          git commit -m 'fix(mobile): Expo 57 공식 의존성 조합으로 네이티브 런타임 정렬'
          git push origin HEAD:refs/heads/feat/harucut-web-app-readiness
      - run: pnpm check:runtime:mobile
      - run: pnpm lint:mobile
      - run: pnpm typecheck:mobile
