name: backend-contract

# 운영 Swagger를 읽기만 한다. 테스트 계정 생성이나 서버 데이터 변경은 하지 않는다.
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/backend-contract.yml
      - scripts/check_backend_contract.py
      - apps/web/app/api/**
      - packages/shared/src/api-error-messages.ts
      - packages/shared/src/plan-errors.ts

permissions:
  contents: read

jobs:
  contract:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Compare frontend with live production Swagger
        run: python3 scripts/check_backend_contract.py --base-url https://api.harucut.com
