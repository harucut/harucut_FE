name: mobile-qa

# 스토어 서명 키 없이 만들 수 있는 설치 시험용 APK. Play 업로드용 서명이 아니다.
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - apps/mobile/**
      - packages/shared/**
      - pnpm-lock.yaml
      - patches/**
      - .github/workflows/mobile-qa.yml

permissions:
  contents: read

concurrency:
  group: mobile-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:runtime:mobile
      - run: pnpm --dir apps/mobile exec expo prebuild --platform android --no-install
      - name: Build installable QA APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: harucut-android-qa-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
