name: codeql

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      # 라벨을 붙이는 순간 워크플로가 다시 돌아야 검사가 시작된다. 이게 없으면 위 `if` 가
      # 다시 평가되지 않아서, 라벨을 붙여도 다음 푸시 전까지 skipped 로 남는다.
      - labeled
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: "30 2 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    # PR 에서는 `run-ci` 라벨이 붙었을 때만 돈다(verify.yml 과 같은 규칙).
    # 잡이 skipped 로 끝나면 GitHub 은 필수 검사 통과로 인정하므로 병합은 막히지 않는다.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # 보안(code-scanning) + 코드 품질(code-quality, "Code quality findings") 동시 분석
          analysis-kinds: code-scanning,code-quality
          # 분석 대상에서 벤더 에이전트 스킬을 제외한다(사유는 설정 파일에 적어 뒀다)
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
