name: dependency-review

# verify 와 같은 규칙으로 `run-ci` 라벨이 있을 때만 돈다 — CI 를 언제 돌릴지는 저장소 주인이 정한다.
#
# 이 검사가 잡아 주던 것 하나는 로컬로 옮겨 뒀다: 락파일과 package.json 이 어긋나면
# `pnpm verify:standard` 가 맨 앞에서 `pnpm install --frozen-lockfile` 로 걸러 준다.
# (버전 범위를 손으로 고치고 락파일을 다시 만들지 않으면 예전에는 여기서만 터졌다.)

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      # 라벨을 붙이는 순간 워크플로가 다시 돌아야 검사가 시작된다. 이게 없으면 위 `if` 가
      # 다시 평가되지 않아서, 라벨을 붙여도 다음 푸시 전까지 skipped 로 남는다.
      - labeled

permissions:
  contents: read

jobs:
  dependency-review:
    # PR 에서는 `run-ci` 라벨이 붙었을 때만 돈다(verify.yml 과 같은 규칙).
    # 잡이 skipped 로 끝나면 GitHub 은 필수 검사 통과로 인정하므로 병합은 막히지 않는다.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Web audit
        id: web_audit
        continue-on-error: true
        working-directory: apps/web
        run: pnpm audit --audit-level moderate

      - name: Mobile audit
        id: mobile_audit
        continue-on-error: true
        working-directory: apps/mobile
        run: pnpm audit --audit-level moderate

      - name: Python audit
        id: python_audit
        continue-on-error: true
        shell: bash
        run: |
          python -m venv .venv-audit
          source .venv-audit/bin/activate
          python -m pip install --upgrade pip pip-audit pip-licenses
          pip-licenses --from=mixed --with-system=false --summary

      - name: NPM license summary
        id: npm_license
        continue-on-error: true
        working-directory: apps/web
        run: npx --yes license-checker-rseidelsohn --summary

      - name: Write summary
        shell: bash
        env:
          WEB_AUDIT_OUTCOME: ${{ steps.web_audit.outcome }}
          MOBILE_AUDIT_OUTCOME: ${{ steps.mobile_audit.outcome }}
          PYTHON_AUDIT_OUTCOME: ${{ steps.python_audit.outcome }}
          NPM_LICENSE_OUTCOME: ${{ steps.npm_license.outcome }}
        run: |
          {
            echo "## Supply Chain Audit"
            echo ""
            echo "- web audit: ${WEB_AUDIT_OUTCOME}"
            echo "- mobile audit: ${MOBILE_AUDIT_OUTCOME}"
            echo "- python audit: ${PYTHON_AUDIT_OUTCOME}"
            echo "- npm license summary: ${NPM_LICENSE_OUTCOME}"
            echo ""
            echo "워크플로는 현재 저장소의 취약점과 라이선스 상태를 보고합니다."
            echo "실제 경보와 자동 수정은 Dependabot alerts 및 security updates로 추적합니다."
          } >> "$GITHUB_STEP_SUMMARY"
