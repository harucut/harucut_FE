version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      expo-runtime:
        dependency-type: "production"
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
        update-types:
          - "minor"
          - "patch"
      web-test-tooling:
        dependency-type: "development"
        patterns:
          - "@axe-core/*"
          - "@playwright/*"
          - "playwright"
          - "jest"
          - "jest-*"
          - "jest-axe"
          - "ts-jest"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"
      web-style-tooling:
        dependency-type: "development"
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss"
        update-types:
          - "minor"
          - "patch"
      lint-tooling:
        dependency-type: "development"
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # Expo SDK가 버전을 고정하는 네이티브 런타임은 patch 포함 모든 자동 범프 금지.
      # RN 버전은 Expo SDK 업그레이드가 단독으로 주도해야 함 (Expo 55는 RN 0.85.2 고정).
      # 회귀 사례: RN minor 범프가 Expo 55 Metro 번들링을 깨뜨림(#303), RN 0.85.3 patch도
      # expo-runtime 그룹으로 반복 유입(#327/#333) → patch까지 ignore로 막는다.
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-reanimated"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-screens"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-safe-area-context"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-gesture-handler"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-worklets"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # expo-* 메이저는 Expo SDK 버전과 1:1로 묶여 있다. SDK 55 프로젝트에 56.x 패키지를
      # 넣으면 그 네이티브 모듈이 expo-modules-core 56 전용 심볼을 참조하는데, 이 레포는
      # core를 55.0.24로 고정(patchedDependencies)하므로 release 빌드에서 즉시 죽는다.
      # 회귀 사례: expo-camera 56이 SDK 55 네이티브 빌드 파손(#328),
      # expo-haptics 56이 AnyTypeCache NoClassDefFoundError 크래시(머지 eb99a49 -> 리버트 f83750e, 재발 #423),
      # expo-splash-screen 56이 락파일까지 들어와 있던 것을 되돌림(#412 유입).
      # JS API가 그대로라 lint/typecheck/CI가 전부 통과해버리므로 자동 범프 자체를 막는다.
      # SDK 55 내 minor/patch(55.0.x)는 허용 — 메이저는 SDK 업그레이드가 단독으로 주도한다.
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "web"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
