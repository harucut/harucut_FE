project:
  name: "harucut"
  repo: "harucut/harucut_FE"
  language: "ko"
  locale: "ko-KR"

goal: |
  Harucut 모바일 앱을 apps/mobile에서 완성도 있게 구현하고 검증한다.
  apps/web는 기존 서비스 기준선으로 유지하며 절대 수정하지 않는다.
  기존에 구성한 Ralph loop, Git 보호, GitHub 템플릿, 보안 설정, 브랜치 정책은 그대로 유지한다.
  모바일은 디자인 품질과 실제 통신 흐름까지 직접 확인한 뒤에만 완료로 판단한다.
  일반 기술 선택은 사용자에게 묻지 않고 진행하고,
  결제, 인증 정보, 외부 계정, 프로덕션 배포, 비가역 데이터 작업만 사용자 확인을 요청한다.
  Discord는 원격 제어, 감사 로그, 필수 승인 채널로만 사용한다.
  이 저장소의 Ralph 자동화는 issue 브랜치 생성과 push까지만 자동화하고,
  PR 생성과 상위 브랜치 승격은 사용자가 지시할 때만 수행한다.

minimum_done:
  - "apps/web 파일은 수정하지 않는다"
  - "apps/mobile만 변경 대상으로 사용한다"
  - "기존 Ralph loop, Git 보호, GitHub 템플릿, 보안 설정이 유지된다"
  - "apps/mobile 화면 구조와 기능이 iOS/Android 기준으로 일관되게 동작한다"
  - "home, shoot, upload, history, mypage 흐름을 직접 확인한다"
  - "레이아웃 깨짐, safe area 문제, 잘림, 겹침, 터치 문제, 색상 대비 문제를 직접 점검한다"
  - "API 통신과 로딩, 에러, 빈 상태, 재시도 흐름을 직접 확인한다"
  - "통신 검증이 불가능하면 이유와 부족한 조건을 명확히 남기고 완료 처리하지 않는다"
  - "pnpm verify:automation, pnpm verify:standard가 통과한다"
  - "변경사항은 issue 브랜치에만 커밋된다"
  - "main, develop, develop_loop에는 직접 commit/push하지 않는다"

loop:
  max_iterations: 40
  failure_threshold: 3
  continue_without_user_by_default: true

ask_user_only_when:
  - "유료 서비스 결제 또는 구독 변경이 필요하다"
  - "API key, secret, token, 외부 계정 인증 정보가 필요하다"
  - "외부 계정 로그인 또는 권한 승인이 필요하다"
  - "프로덕션 배포가 필요하다"
  - "DB migration 또는 데이터 작업이 비가역적이거나 위험하다"

writing:
  language: "ko"
  style: "모든 진행 요약, Discord 메시지, 로그 요약, 설명, PR 요약은 한국어로 작성한다."
  avoid:
    - "불필요한 영어 설명"
    - "과장된 보고체"
    - "내용 없는 AI 말투"

context_docs:
  - "README.md"
  - "AGENTS.md"
  - "docs/route-flows.md"
  - "docs/auth-routing.md"
  - "docs/mobile-app-blueprint.md"
  - "docs/mobile-qa-checklist.md"
  - "docs/adr/ADR-0001-모바일-확장-전략.md"

workspace_policy:
  read_only_paths:
    - "apps/web/"
  write_allowed_paths:
    - "apps/mobile/"
    - "docs/"
    - ".ralph-loop.yml"
    - "AGENTS.md"
    - "README.md"
    - "scripts/"
    - ".codex/"
    - ".githooks/"
    - ".github/"
  forbid_web_changes: true

verification_policy:
  require_visual_check: true
  require_api_check: true
  require_mobile_only_scope: true
  required_screens:
    - "home"
    - "shoot"
    - "upload"
    - "history"
    - "mypage"
  design_checks:
    - "safe area가 깨지지 않는다"
    - "텍스트 잘림과 겹침이 없다"
    - "탭 이동과 버튼 터치 영역이 자연스럽다"
    - "색상 대비와 가독성이 유지된다"
    - "로딩/빈 상태/에러 상태가 시각적으로 어색하지 않다"
  api_checks:
    - "인증 또는 세션 확인 흐름"
    - "업로드 또는 presigned upload 흐름"
    - "히스토리/마이페이지 데이터 조회 흐름"
    - "실패 시 사용자 메시지와 재시도 흐름"
  direct_check_required: true
  no_unverified_claims: true

product:
  target_users:
    - "하루컷으로 인생네컷 사진을 만들고 편집하려는 일반 사용자"
    - "모바일에서 촬영부터 결과 저장까지 빠르게 끝내려는 반복 사용자"
  priorities:
    - "촬영과 업로드 진입이 빠른 구조"
    - "초보자도 바로 이해할 수 있는 정보 구조"
    - "기능보다 먼저 화면 흐름과 사용성 완성도 확보"
    - "향후 고급 편집, 비디오 생성, 테마 에디터로 확장 가능한 구조"

mobile_policy:
  phase_1:
    - "앱 골격, 정보 구조, 서비스 소개, API 연결 지점, 인증 저장소, 카메라/업로드 확장 기반"
    - "복잡한 Konva/WebCodecs 편집기는 그대로 옮기지 않는다"
  phase_2:
    - "촬영 가이드, 업로드 흐름, 결과 확인, 히스토리/마이페이지 연결"
  phase_3:
    - "테마 편집, 고급 생성, 배경 제거, 비디오 생성은 서버 또는 별도 렌더링 전략으로 확장"

runtime:
  bridge_host: "127.0.0.1"
  bridge_port: 8788
  ascii_workspace_drive: "Y:"

discord:
  mode: "all"
  channel_id: ""
  thread_per_run: false
  notify_on:
    - "start"
    - "issue_created"
    - "tests_failed_3_times"
    - "blocked"
    - "needs_paid_service"
    - "needs_secret"
    - "complete"
  remote_commands:
    - "/ralph status"
    - "/ralph pause"
    - "/ralph resume"
    - "/ralph stop"
    - "/ralph nudge <message>"
    - "/ralph goal <message>"
    - "/ralph done <message>"
    - "/ralph logs"
    - "/ralph pr"

git:
  base_branch: "develop_loop"
  protected_branches:
    - "main"
    - "develop"
    - "develop_loop"
  no_commit_on:
    - "main"
    - "develop"
    - "develop_loop"
  no_direct_push_to:
    - "main"
    - "develop"
    - "develop_loop"
  issue_branch_prefix: "issue"
  issue_title_format: "<type>: <summary>"
  issue_title_prefixes:
    - "feat"
    - "fix"
    - "refactor"
    - "docs"
    - "chore"
    - "ci"
    - "test"
    - "perf"
  forbid_generic_issue_titles: true
  pr_base: "develop_loop"
  merge_strategy: "merge"
  auto_create_issue_pr: false
  promote_to_develop:
    source_branch: "develop_loop"
    target_branch: "develop"
    strategy: "merge"
    approval_required: true
  auto_create_release_pr: false
  release_to_main:
    source_branch: "develop"
    target_branch: "main"
    strategy: "merge"
    author: "alpaka206"
    head_branch_only: true
  delete_branch_after_merge: true
  release_to_main_policy: "pr-only-manual-merge"

commands:
  install: "pnpm install"
  lint: "pnpm lint:mobile"
  test: "pnpm typecheck:mobile"
  build: "pnpm verify:standard"
  verify:
    - "python scripts/verify_ralph_setup.py"
    - "pnpm test:web"
    - "pnpm build:web"
    - "pnpm lint:mobile"
    - "pnpm typecheck:mobile"

agents:
  planner: true
  implementer: true
  reviewer: true
  tester: true
  gitops: true
  agent_discussion_policy: "internal_codex_subagents"
  discord_for_agent_discussion: "summary_only"
